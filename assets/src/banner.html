<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
body{width:1680px;height:480px;overflow:hidden;position:relative}
.glow{position:absolute;right:120px;top:-60px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,#ff8f4a2e,#ff8f4a0d 45%,transparent 70%)}
.dots{position:absolute;right:150px;top:-30px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#ffc27a55 1.2px,transparent 1.6px) 0 0/26px 26px;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.orbit{position:absolute;right:40px;top:150px;width:780px;height:190px;border:2px solid #ffc27a66;border-radius:50%;transform:rotate(-8deg)}
.mark{position:absolute;right:300px;top:110px;width:260px;height:260px}
.copy{position:absolute;left:110px;top:118px;width:900px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:14px}
.eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--sodium);box-shadow:0 0 18px #ff8f4a}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:650;font-size:88px;line-height:1.02;letter-spacing:-.035em;margin-top:22px}
h1 span{color:var(--lamp)}
p{margin-top:26px;font-size:27px;line-height:1.4;color:var(--muted);max-width:820px}
.rule{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--sodium),#ff8f4a00 60%)}
</style></head><body>
<div class="glow"></div><div class="dots"></div><div class="orbit"></div>
<img class="mark" src="mark.svg" alt="">
<div class="copy">
  <div class="eyebrow"><i></i>Silent Protocol</div>
  <h1>Quiet software,<br><span>on watch.</span></h1>
  <p>Security and automation for Discord, ordering for cafés, and open&#8209;source tools you run yourself.</p>
</div>
<div class="rule"></div>
</body></html>
